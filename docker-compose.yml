# Local development only: Postgres and Redis.
# Point DATABASE_URL at a copy of the Rails database to work against real schema.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tedix
      POSTGRES_PASSWORD: tedix
      POSTGRES_DB: tedix_development
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
volumes:
  pgdata:
