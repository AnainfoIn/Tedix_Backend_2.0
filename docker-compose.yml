# Local or VPS setup: Postgres database + Tedix API/admin panel.
#
#   cp .env.example .env      # set passwords and ports
#   docker compose up -d --build
#
# Database:     localhost:${DB_PORT}   (psql, TablePlus, DBeaver...)
# Admin panel:  http://localhost:${API_PORT}/admin/
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-tedix}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-tedix_development}
      # Optional first admin user, created only when the database is first initialised.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    image: tedix-api:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-tedix}:${DB_PASSWORD}@db:5432/${DB_NAME:-tedix_development}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?Set ADMIN_JWT_SECRET in .env}
      ADMIN_JWT_TTL_HOURS: ${ADMIN_JWT_TTL_HOURS:-12}
      ADMIN_2FA_ISSUER: ${ADMIN_2FA_ISSUER:-Tedix Admin}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      PORT: 4000
    ports:
      - "${API_PORT:-4000}:4000"

volumes:
  pgdata:
